<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZyraWorks — Oficinas Virtuales</title>
<style>
  :root {
    --bg: #0f1420;
    --floor: #161d2e;
    --desk: #232c42;
    --wall-line: #2a3350;
    --text: #e7ecf7;
    --muted: #8b96b3;
    --idle: #4da3ff;
    --working: #ffb020;
    --error: #ff4d6d;
    --accent: #7c5cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 18px 24px 8px;
  }
  h1 { margin: 0; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #22304f;
    color: var(--muted);
    margin-left: 8px;
    vertical-align: middle;
  }

  .office {
    position: relative;
    margin: 16px 24px 24px;
    height: 560px;
    background:
      repeating-linear-gradient(0deg, var(--wall-line) 0 1px, transparent 1px 80px),
      repeating-linear-gradient(90deg, var(--wall-line) 0 1px, transparent 1px 80px),
      var(--floor);
    border-radius: 16px;
    border: 1px solid #2a3350;
    overflow: hidden;
  }

  .room-label {
    position: absolute;
    top: 12px;
    left: 16px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .desk {
    position: absolute;
    width: 96px;
    height: 56px;
    background: var(--desk);
    border-radius: 8px;
    border: 1px solid #303c5c;
  }

  .agent {
    position: absolute;
    width: 64px;
    text-align: center;
    transition: left 1.2s ease, top 1.2s ease;
  }
  .avatar {
    width: 40px;
    height: 40px;
    margin: 0 auto 4px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff2, transparent 60%), var(--idle);
    box-shadow: 0 0 0 4px rgba(77,163,255,0.15);
    position: relative;
    animation: bob 2.4s ease-in-out infinite;
  }
  .agent[data-status="working"] .avatar {
    background: radial-gradient(circle at 35% 30%, #fff2, transparent 60%), var(--working);
    box-shadow: 0 0 0 4px rgba(255,176,32,0.18);
    animation: bob 0.9s ease-in-out infinite;
  }
  .agent[data-status="error"] .avatar {
    background: radial-gradient(circle at 35% 30%, #fff2, transparent 60%), var(--error);
    box-shadow: 0 0 0 4px rgba(255,77,109,0.2);
    animation: shake 0.5s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }
  .name { font-size: 11px; font-weight: 600; }
  .status-text {
    font-size: 10px;
    color: var(--muted);
    margin-top: 1px;
  }
  .status-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 4px;
    background: var(--idle);
  }
  .agent[data-status="working"] .status-dot { background: var(--working); }
  .agent[data-status="error"] .status-dot { background: var(--error); }

  .bubble {
    position: absolute;
    bottom: 58px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 220px;
    background: #1c2438;
    border: 1px solid #303c5c;
    color: var(--text);
    font-size: 11px;
    padding: 6px 9px;
    border-radius: 8px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    white-space: normal;
  }
  .agent.show-bubble .bubble { opacity: 1; }

  footer {
    padding: 0 24px 24px;
    color: var(--muted);
    font-size: 12px;
  }
  .live-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #3ddc84;
    margin-right: 6px;
    box-shadow: 0 0 6px #3ddc84;
  }
  .sim-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
</style>
</head>
<body>
<header>
  <h1>ZyraWorks — Oficinas Virtuales <span class="badge" id="mode-badge">conectando…</span></h1>
  <div class="sub" id="mode-text">
    <span class="live-dot sim-dot" id="mode-dot"></span>Buscando el backend en /api/agents/status…
  </div>
</header>

<div class="office" id="office">
  <div class="room-label">Piso 1 · Infraestructura &amp; Soporte</div>
  <!-- los escritorios son solo decoracion de la escena -->
  <div class="desk" style="left:60px; top:120px;"></div>
  <div class="desk" style="left:220px; top:220px;"></div>
  <div class="desk" style="left:380px; top:120px;"></div>
  <div class="desk" style="left:540px; top:220px;"></div>
  <div class="desk" style="left:700px; top:120px;"></div>
</div>

<footer>
  Este dashboard arranca con datos simulados y pasa a datos reales automaticamente
  apenas el backend (<code>/api/agents/status</code>) responde. No hace falta tocar nada.
</footer>

<script>
const OFFICE_ID = "office";
const POLL_MS = 3000;

// Posiciones "de escritorio" fijas para que cada agente tenga su lugar en la oficina.
const DESK_SPOTS = [
  { left: 40, top: 70 }, { left: 200, top: 170 }, { left: 360, top: 70 },
  { left: 520, top: 170 }, { left: 680, top: 70 }, { left: 40, top: 320 },
  { left: 360, top: 320 },
];

const SIM_ACTIONS = [
  "Revisando estado de VMs en vCenter",
  "Analizando ticket entrante",
  "Consultando logs de backup (Veeam)",
  "Chequeando espacio en TrueNAS",
  "Esperando el proximo mensaje",
  "Armando diagnostico de red",
];

let simAgents = [
  { slug: "infrastructure", display_name: "Infrastructure Agent", status: "idle", last_action: "Esperando el primer mensaje" },
];

const elements = new Map();

function ensureAgentEl(agent, index) {
  let el = elements.get(agent.slug);
  if (el) return el;

  const spot = DESK_SPOTS[index % DESK_SPOTS.length];
  el = document.createElement("div");
  el.className = "agent";
  el.style.left = spot.left + "px";
  el.style.top = spot.top + "px";
  el.innerHTML = `
    <div class="bubble"></div>
    <div class="avatar"></div>
    <div class="name">${agent.display_name}</div>
    <div class="status-text"><span class="status-dot"></span><span class="status-label"></span></div>
  `;
  document.getElementById(OFFICE_ID).appendChild(el);
  elements.set(agent.slug, el);
  return el;
}

function statusLabel(status) {
  if (status === "working") return "trabajando";
  if (status === "error") return "error";
  return "disponible";
}

function render(agents) {
  agents.forEach((agent, i) => {
    const el = ensureAgentEl(agent, i);
    el.dataset.status = agent.status;
    el.querySelector(".status-label").textContent = statusLabel(agent.status);

    const bubble = el.querySelector(".bubble");
    if (agent.last_action && bubble.textContent !== agent.last_action) {
      bubble.textContent = agent.last_action;
      el.classList.add("show-bubble");
      clearTimeout(el._bubbleTimer);
      el._bubbleTimer = setTimeout(() => el.classList.remove("show-bubble"), 4000);
    }
  });
}

function setMode(live) {
  const badge = document.getElementById("mode-badge");
  const text = document.getElementById("mode-text");
  const dot = document.getElementById("mode-dot");
  if (live) {
    badge.textContent = "datos en vivo";
    dot.classList.remove("sim-dot");
    text.innerHTML = '<span class="live-dot" id="mode-dot"></span>Conectado al backend real.';
  } else {
    badge.textContent = "datos simulados";
    text.innerHTML = '<span class="live-dot sim-dot" id="mode-dot"></span>Backend todavia no disponible — mostrando una simulacion para previsualizar la escena.';
  }
}

function tickSimulation() {
  simAgents = simAgents.map((a) => {
    const goWorking = Math.random() < 0.35;
    return {
      ...a,
      status: goWorking ? "working" : "idle",
      last_action: goWorking
        ? SIM_ACTIONS[Math.floor(Math.random() * SIM_ACTIONS.length)]
        : a.last_action,
    };
  });
  render(simAgents);
}

async function poll() {
  try {
    const res = await fetch("/api/agents/status", { cache: "no-store" });
    if (!res.ok) throw new Error("bad status");
    const agents = await res.json();
    setMode(true);
    render(agents);
  } catch (e) {
    setMode(false);
    tickSimulation();
  }
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
