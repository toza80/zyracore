<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZyraWorks — Oficinas Virtuales</title>
<style>
  :root {
    --bg: #0f1420;
    --floor: #161d2e;
    --desk: #232c42;
    --wall-line: #2a3350;
    --text: #e7ecf7;
    --muted: #8b96b3;
    --idle: #4da3ff;
    --working: #ffb020;
    --error: #ff4d6d;
    --accent: #7c5cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 18px 24px 8px;
  }
  h1 { margin: 0; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #22304f;
    color: var(--muted);
    margin-left: 8px;
    vertical-align: middle;
  }

  /* Piso: una grilla de oficinas, una por agente */
  .floor {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
    margin: 16px 24px 24px;
  }

  .office-room {
    position: relative;
    min-height: 250px;
    background:
      repeating-linear-gradient(0deg, var(--wall-line) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, var(--wall-line) 0 1px, transparent 1px 40px),
      var(--floor);
    border-radius: 16px;
    border: 1px solid #2a3350;
    border-top: 3px solid var(--room-accent, var(--accent));
    overflow: hidden;
  }

  .room-label {
    position: absolute;
    top: 14px;
    left: 16px;
    right: 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--room-accent, var(--text));
  }
  .room-subtitle {
    position: absolute;
    top: 34px;
    left: 16px;
    right: 16px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .desk {
    position: absolute;
    top: 158px;
    left: 50%;
    transform: translateX(-50%);
    width: 96px;
    height: 56px;
    background: var(--desk);
    border-radius: 8px;
    border: 1px solid #303c5c;
  }

  .agent {
    position: absolute;
    top: 78px;
    left: 50%;
    transform: translateX(-50%);
    width: 96px;
    text-align: center;
  }
  .avatar {
    width: 44px;
    height: 44px;
    margin: 0 auto 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff2, transparent 60%), var(--idle);
    box-shadow: 0 0 0 4px rgba(77,163,255,0.15);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: bob 2.4s ease-in-out infinite;
  }
  .avatar svg { display: block; width: 22px; height: 22px; }
  .agent[data-status="working"] .avatar {
    background: radial-gradient(circle at 35% 30%, #fff2, transparent 60%), var(--working);
    box-shadow: 0 0 0 4px rgba(255,176,32,0.18);
    animation: bob 0.9s ease-in-out infinite;
  }
  .agent[data-status="error"] .avatar {
    background: radial-gradient(circle at 35% 30%, #fff2, transparent 60%), var(--error);
    box-shadow: 0 0 0 4px rgba(255,77,109,0.2);
    animation: shake 0.5s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }
  .status-text {
    font-size: 11px;
    color: var(--muted);
  }
  .status-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 4px;
    background: var(--idle);
  }
  .agent[data-status="working"] .status-dot { background: var(--working); }
  .agent[data-status="error"] .status-dot { background: var(--error); }

  .bubble {
    position: absolute;
    bottom: 62px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    background: #1c2438;
    border: 1px solid #303c5c;
    color: var(--text);
    font-size: 11px;
    padding: 6px 9px;
    border-radius: 8px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    white-space: normal;
  }
  .agent.show-bubble .bubble { opacity: 1; }

  footer {
    padding: 0 24px 24px;
    color: var(--muted);
    font-size: 12px;
  }
  .live-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #3ddc84;
    margin-right: 6px;
    box-shadow: 0 0 6px #3ddc84;
  }
  .sim-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
</style>
</head>
<body>
<header>
  <h1>ZyraWorks — Oficinas Virtuales <span class="badge" id="mode-badge">conectando…</span></h1>
  <div class="sub" id="mode-text">
    <span class="live-dot sim-dot" id="mode-dot"></span>Buscando el backend en /api/agents/status…
  </div>
</header>

<div class="floor" id="floor"></div>

<footer>
  Cada agente tiene su propia oficina. Este dashboard arranca con datos simulados y pasa a
  datos reales automaticamente apenas el backend (<code>/api/agents/status</code>) responde.
</footer>

<script>
const FLOOR_ID = "floor";
const POLL_MS = 3000;

// Metadata visual por agente: color de acento + subtitulo del "departamento".
// Un agente nuevo que no este en este mapa usa DEFAULT_META automaticamente.
// Iconos SVG inline (sin depender de imagenes externas) que representan el
// rol de cada agente dentro de su avatar circular.
const ICON_SERVER = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.4"/><rect x="3" y="14" width="18" height="6" rx="1.4"/><circle cx="7" cy="7" r="0.9" fill="white" stroke="none"/><circle cx="7" cy="17" r="0.9" fill="white" stroke="none"/></svg>`;

const ICON_PALETTE = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-4.97 0-9 3.58-9 8 0 3.31 2.69 5 5 5h1.1c.6 0 1.1.5 1.1 1.1 0 .28-.1.54-.28.75-.2.23-.28.5-.28.79 0 .6.5 1.1 1.1 1.1C15.4 19.75 19 15.9 19 11c0-4.42-3.13-8-7-8z"/><circle cx="7.6" cy="10.6" r="1" fill="white" stroke="none"/><circle cx="12" cy="7.6" r="1" fill="white" stroke="none"/><circle cx="16" cy="10.2" r="1" fill="white" stroke="none"/></svg>`;

const ICON_CODE = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 3 12 9 18"/><polyline points="15 6 21 12 15 18"/></svg>`;

const ICON_DEFAULT = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>`;

const AGENT_META = {
  infrastructure: { subtitle: "Infraestructura & Soporte", accent: "#4da3ff", icon: ICON_SERVER },
  color:          { subtitle: "Gestion de Color",          accent: "#ff6fae", icon: ICON_PALETTE },
  coder:          { subtitle: "Desarrollo",                accent: "#3ddc84", icon: ICON_CODE },
};
const DEFAULT_META = { subtitle: "Equipo ZyraWorks", accent: "#7c5cff", icon: ICON_DEFAULT };

const SIM_ACTIONS = [
  "Revisando estado de VMs en vCenter",
  "Analizando ticket entrante",
  "Consultando logs de backup (Veeam)",
  "Chequeando espacio en TrueNAS",
  "Esperando el proximo mensaje",
  "Armando diagnostico de red",
  "Analizando CGATS vs Fogra39",
  "Calculando spread de TVI",
  "Revisando ΔE de un solido",
];

let simAgents = [
  { slug: "infrastructure", display_name: "Infrastructure Agent", status: "idle", last_action: "Esperando el primer mensaje" },
  { slug: "color",          display_name: "Color Agent",          status: "idle", last_action: "Esperando el primer mensaje" },
];

const rooms = new Map();

function ensureRoom(agent, index) {
  let entry = rooms.get(agent.slug);
  if (entry) return entry;

  const meta = AGENT_META[agent.slug] || DEFAULT_META;
  const room = document.createElement("div");
  room.className = "office-room";
  room.style.setProperty("--room-accent", meta.accent);
  room.innerHTML = `
    <div class="room-label">${agent.display_name}</div>
    <div class="room-subtitle">${meta.subtitle}</div>
    <div class="desk"></div>
    <div class="agent">
      <div class="bubble"></div>
      <div class="avatar">${meta.icon}</div>
      <div class="status-text"><span class="status-dot"></span><span class="status-label"></span></div>
    </div>
  `;
  document.getElementById(FLOOR_ID).appendChild(room);

  entry = { room, agentEl: room.querySelector(".agent") };
  rooms.set(agent.slug, entry);
  return entry;
}

function statusLabel(status) {
  if (status === "working") return "trabajando";
  if (status === "error") return "error";
  return "disponible";
}

function render(agents) {
  agents.forEach((agent, i) => {
    const { agentEl } = ensureRoom(agent, i);
    agentEl.dataset.status = agent.status;
    agentEl.querySelector(".status-label").textContent = statusLabel(agent.status);

    const bubble = agentEl.querySelector(".bubble");
    if (agent.last_action && bubble.textContent !== agent.last_action) {
      bubble.textContent = agent.last_action;
      agentEl.classList.add("show-bubble");
      clearTimeout(agentEl._bubbleTimer);
      agentEl._bubbleTimer = setTimeout(() => agentEl.classList.remove("show-bubble"), 4000);
    }
  });
}

function setMode(live) {
  const badge = document.getElementById("mode-badge");
  const text = document.getElementById("mode-text");
  if (live) {
    badge.textContent = "datos en vivo";
    text.innerHTML = '<span class="live-dot" id="mode-dot"></span>Conectado al backend real.';
  } else {
    badge.textContent = "datos simulados";
    text.innerHTML = '<span class="live-dot sim-dot" id="mode-dot"></span>Backend todavia no disponible — mostrando una simulacion para previsualizar la escena.';
  }
}

function tickSimulation() {
  simAgents = simAgents.map((a) => {
    const goWorking = Math.random() < 0.35;
    return {
      ...a,
      status: goWorking ? "working" : "idle",
      last_action: goWorking
        ? SIM_ACTIONS[Math.floor(Math.random() * SIM_ACTIONS.length)]
        : a.last_action,
    };
  });
  render(simAgents);
}

async function poll() {
  try {
    const res = await fetch("/api/agents/status", { cache: "no-store" });
    if (!res.ok) throw new Error("bad status");
    const agents = await res.json();
    if (!agents.length) throw new Error("sin agentes todavia");
    setMode(true);
    render(agents);
  } catch (e) {
    setMode(false);
    tickSimulation();
  }
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
